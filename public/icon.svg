<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="upiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f52ba" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="104" fill="url(#upiGrad)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" fill="none" />
  
  <!-- Central emblem card -->
  <rect x="116" y="116" width="280" height="280" rx="36" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Indian Rupee symbol & Calculator accents -->
  <!-- Rupee Symbol in Emerald / Deep Green -->
  <path d="M 200 170 L 312 170 M 200 196 L 290 196 M 200 170 L 200 240 C 230 240 258 238 274 218 C 290 198 286 170 286 170 M 216 238 L 296 342" 
        stroke="#065f46" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Badge banner with MDR text -->
  <rect x="156" y="324" width="200" height="44" rx="22" fill="url(#accentGrad)" />
  <text x="256" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">UPI MDR</text>

  <!-- Small tricolor dots indicating India -->
  <circle cx="236" cy="425" r="7" fill="#ff9933" />
  <circle cx="256" cy="425" r="7" fill="#ffffff" />
  <circle cx="276" cy="425" r="7" fill="#138808" />
</svg>